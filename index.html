<!DOCTYPE html>
<html>
<head>
    <title>TimesUp!</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            background:#000;
            color:white;
            font-family:Helvetica,sans-serif;
            text-align:center;
        }

        h1{
            min-height:100px;
            margin-top:50px;
        }

        button, select{
            width:60vw;
            max-width:400px;
            height:60px;
            margin:10px;
            border-radius:30px;
            font-size:20px;
        }

        #knopStart{background:#008CBA;color:white;}
        #knopJuist{background:#00E67A;}
        #knopSkip{background:#f44336;color:white;}
    </style>
</head>

<body>

<h2 id="tekstUitleg">Kies een woordenlijst en druk op Start</h2>
<h1 id="tekstWoord">TimesUp!</h1>

<select id="lijstKeuze">
    <option value="">Kies een categorie</option>
    <option value="films">Films</option>
    <option value="dieren">Dieren</option>
    <option value="liedjes">Liedjes</option>
</select>

<br>

<button id="knopStart">Start</button>
<button id="knopJuist">Juist</button>
<button id="knopSkip">Skip</button>

<script>

const woordenFilms = [
"The Godfather",
"Titanic",
"Avatar",
"Jaws",
"Rocky",
"Gladiator",
"Inception",
"The Matrix",
"Interstellar",
"Joker"
];

const woordenDieren = [
"hond",
"kat",
"paard",
"koe",
"leeuw",
"tijger",
"olifant",
"giraf",
"dolfijn",
"axolotl"
];

const woordenLiedjes = [
"Bohemian Rhapsody",
"Imagine",
"Hey Jude",
"Thriller",
"Billie Jean",
"Wonderwall",
"Poker Face",
"Halo",
"Despacito",
"Blinding Lights"
];

let woordenLijst = [];
let woordenBasis = [];

let team = 0;
let score = [0,0];
let timer;

document.getElementById("knopStart").addEventListener("click", start);

function vulWoorden(){

    const keuze = document.getElementById("lijstKeuze").value;

    if(keuze===""){
        alert("Kies eerst een categorie.");
        return false;
    }

    if(keuze==="films"){
        woordenLijst = [...woordenFilms];
    }

    if(keuze==="dieren"){
        woordenLijst = [...woordenDieren];
    }

    if(keuze==="liedjes"){
        woordenLijst = [...woordenLiedjes];
    }

    woordenBasis = [];

    for(let i=0;i<30;i++){
        woordenBasis.push(
            woordenLijst[Math.floor(Math.random()*woordenLijst.length)]
        );
    }

    return true;
}

function start(){

    if(woordenBasis.length===0){
        if(!vulWoorden()){
            return;
        }
    }

    document.getElementById("knopStart").removeEventListener("click",start);

    if(score[0]+score[1] < 30){
        document.getElementById("tekstUitleg").textContent =
        "Ronde 1 - Team " + (team+1);
    }

    if(score[0]+score[1] >= 30 && score[0]+score[1] < 60){
        document.getElementById("tekstUitleg").textContent =
        "Ronde 2 - Team " + (team+1);

        document.getElementById("knopSkip")
            .addEventListener("click",skipWoord);
    }

    if(score[0]+score[1] >= 60){
        document.getElementById("tekstUitleg").textContent =
        "Ronde 3 - Team " + (team+1);

        document.getElementById("knopSkip")
            .addEventListener("click",skipWoord);
    }

    document.getElementById("tekstWoord").textContent = woordenBasis[0];

    document.getElementById("knopJuist")
        .addEventListener("click",volgendWoord);

    timer = setTimeout(knoppenAf,30000);
}

function volgendWoord(){

    woordenBasis.push(woordenBasis.shift());

    score[team]++;

    document.getElementById("tekstWoord").textContent =
    woordenBasis[0];

    if((score[0]+score[1]) % 30 === 0){

        timerAf();
        toonScore();
        shuffleArray();
        knoppenAf();
    }
}

function skipWoord(){

    woordenBasis.push(woordenBasis.shift());

    document.getElementById("tekstWoord").textContent =
    woordenBasis[0];
}

function knoppenAf(){

    clearTimeout(timer);

    document.getElementById("knopJuist")
        .removeEventListener("click",volgendWoord);

    document.getElementById("knopSkip")
        .removeEventListener("click",skipWoord);

    team = 1-team;

    document.getElementById("tekstWoord").textContent = "";

    document.getElementById("tekstUitleg").textContent =
    "Team " + (team+1) + " is aan de beurt";

    document.getElementById("knopStart")
        .addEventListener("click",start);
}

function timerAf(){
    clearTimeout(timer);
}

function toonScore(){

    document.getElementById("tekstWoord").textContent =
    "Score Team 1: " + score[0] +
    " - Team 2: " + score[1];
}

function shuffleArray(){

    for(let i=woordenBasis.length-1;i>0;i--){

        const j=Math.floor(Math.random()*(i+1));

        [woordenBasis[i],woordenBasis[j]] =
        [woordenBasis[j],woordenBasis[i]];
    }
}

</script>

</body>
</html>

			// VARIABELEN

			let team=0;
			score=[0,0];
			let woordenBasis=[];
			var timer;

			for (i=0;i<30;i++){
				var woord = woordenLijst[Math.round(Math.random() * woordenLijst.length)];
				woordenBasis.push(woord);
			}	
			
			// SHUFFLE
		

			//FUNCTIONS

			document.getElementById("knopStart").addEventListener("click", start);

			function start(){
				document.getElementById("knopStart").removeEventListener ("click", start);

				if (score[0]+score[1]<30){
					document.getElementById("tekstUitleg").textContent = "Ronde 1 - Team "+(team+1)+": Leg dit woord uit, gebruik geen woorden uit dezelfde familie, gebruik geen vertalingen, je mag niet skippen.";
					document.getElementById("tekstWoord").textContent = woordenBasis[0];
					document.getElementById("knopJuist").addEventListener ("click", volgendWoord);
					timer = setTimeout(knoppenAf,30000);
				}
				if (30<=score[0]+score[1] && score[0]+score[1]<60){
					document.getElementById("tekstUitleg").textContent = "Ronde 2 - Team "+(team+1)+": Leg dit woord uit met 1 woord, je mag skippen.";
					document.getElementById("tekstWoord").textContent = woordenBasis[0];
					document.getElementById("knopJuist").addEventListener ("click", volgendWoord);
					document.getElementById("knopSkip").addEventListener ("click", skipWoord);
					timer = setTimeout(knoppenAf,30000);
				}
				if (60<=score[0]+score[1] && score[0]+score[1]<90){
					document.getElementById("tekstUitleg").textContent = "Ronde 3 - Team "+(team+1)+": Beeld dit woord uit, je mag skippen.";
					document.getElementById("tekstWoord").textContent = woordenBasis[0];
					document.getElementById("knopJuist").addEventListener ("click", volgendWoord);
					document.getElementById("knopSkip").addEventListener ("click", skipWoord);
					timer = setTimeout(knoppenAf,30000);
				}
			}

			function timerAf(){
				clearTimeout(timer);
			}

			function playJuist() {
				const audio1 = new Audio("juist.mp3");
  				audio1.play();
			}
	
			function playFout() {
				const audio2 = new Audio("fout.mp3");
  				audio2.play();
			}

			function volgendWoord(){
				woordenBasis.push(woordenBasis.shift());
				score[team]++;
				playJuist();
				document.getElementById("tekstWoord").textContent = woordenBasis[0];
				if ((score[0]+score[1]) %30 ==0){
					knoppenAf();
					timerAf();
					toonScore();
					shuffleArray();
				}
			}

			function skipWoord(){
				woordenBasis.splice((29-((score[0]+score[1])%30)),0,woordenBasis.shift());
				playFout();
				document.getElementById("tekstWoord").textContent = woordenBasis[0];
			}

			function knoppenAf(){
				playFout();
				document.getElementById("knopJuist").removeEventListener ("click", volgendWoord);
				document.getElementById("knopSkip").removeEventListener ("click", skipWoord);
				team=1-team;
				document.getElementById("tekstWoord").textContent = "";
				document.getElementById("tekstUitleg").textContent = "Team "+(team+1)+" is aan de beurt!";
				document.getElementById("knopStart").addEventListener("click", start);
			}

			function toonScore(){
				document.getElementById("tekstWoord").textContent = "Score: Team 1: "+score[0]+" - Team 2: "+score[1];
				document.getElementById("tekstUitleg").textContent = "Team "+(team+1)+" is aan de beurt!";
			}
	
			function shuffleArray(){
				for (let i = woordenBasis.length-1; i > 0; i--){
					const j = Math.floor(Math.random() * i);
					const temp = woordenBasis[i];
					woordenBasis[i] = woordenBasis[j];
					woordenBasis[j] = temp;
				}
			}

		</script>
